name: YouTube to Transcript

on:
  workflow_dispatch:
    inputs:
      youtube_urls:
        description: >
          One or more YouTube URLs, separated by newlines or spaces.
          Example: https://youtu.be/abc123 https://youtu.be/def456
        required: true
        type: string

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------------
      - name: Install system dependencies (ffmpeg + nodejs for yt-dlp)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg nodejs

      # ---------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin torch to CPU-only build to avoid downloading 2 GB of CUDA libs
          pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install \
            yt-dlp \
            youtube-transcript-api \
            requests \
            openai-whisper

      # ---------------------------------------------------------------
      - name: Parse URLs and run transcription
        env:
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          INPUT_YOUTUBE_URLS: ${{ github.event.inputs.youtube_urls }}
        run: |
          # Convert the multi-line / space-separated input into individual args.
          # We use Python itself to safely split and pass them to the script.
          python - <<'PYEOF'
          import subprocess, sys, os

          raw = os.environ.get("INPUT_YOUTUBE_URLS", "")
          # Split on whitespace and newlines, filter empty strings
          urls = [u.strip() for u in raw.replace("\n", " ").split() if u.strip()]

          if not urls:
              print("ERROR: No URLs provided.")
              sys.exit(1)

          print(f"Processing {len(urls)} URL(s):")
          for u in urls:
              print(f"  • {u}")

          cmd = [sys.executable, "transcribe_youtube.py"] + urls
          result = subprocess.run(cmd, check=False)
          sys.exit(result.returncode)
          PYEOF

      # ---------------------------------------------------------------
      - name: Upload transcripts as artifact
        if: always()   # upload even if some videos failed
        uses: actions/upload-artifact@v4
        with:
          name: transcripts
          path: transcripts/
          if-no-files-found: warn
          retention-days: 7
          overwrite: true
